<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { step: 0 };
    this.timers = [];
  }
  componentDidMount() { this.play(); }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; }
  play() {
    this.clear();
    this.setState({ step: 0 });
    const at = (ms, step) => this.timers.push(setTimeout(() => this.setState({ step }), ms));
    at(700, 1);
    at(1900, 2);
    at(2900, 3);
  }
  renderVals() {
    const s = this.state.step;
    const moving = s >= 1;
    const ease = 'cubic-bezier(.65,0,.2,1)';
    const lt = (i) => s >= 2 ? `opacity 600ms ease ${i * 90}ms, transform 700ms ${ease} ${i * 90}ms` : 'none';
    return {
      hx: moving ? 0 : -128,
      hy: moving ? 0 : -3,
      hr: moving ? 0 : 30 - 360,
      hs: moving ? 1 : 1.9,
      helmT: moving ? `transform 1900ms ${ease}` : 'none',
      dash: moving ? '360 0' : '276 84',
      dashOff: moving ? 0 : -12,
      rimT: moving ? 'stroke-dasharray 1100ms ease 500ms, stroke-dashoffset 1100ms ease 500ms' : 'none',
      miss: moving ? 1 : 0,
      lo: s >= 2 ? 1 : 0,
      ly: s >= 2 ? 0 : 14,
      lt0: lt(0), lt1: lt(1), lt2: lt(2), lt3: lt(3), lt4: lt(4),
      to: s >= 3 ? 1 : 0,
      ty: s >= 3 ? 0 : 12,
      tt: s >= 3 ? 'opacity 700ms ease, transform 700ms ease' : 'none',
      replay: () => this.play(),
    };
  }
}
</script>
