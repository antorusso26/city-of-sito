<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { active: 0, rot: 0 };
  }
  turnTo(i) {
    const n = 6;
    const cur = this.state.active;
    let d = ((i - cur) % n + n) % n;
    if (d > n / 2) d -= n;
    this.setState({ active: i, rot: this.state.rot - d * 60 });
  }
  renderVals() {
    const cities = [{"name": "Sorrento", "color": "#F2B705", "coord": "40°37′N · 14°22′E", "live": true}, {"name": "Positano", "color": "#E0528A", "coord": "40°38′N · 14°29′E", "live": false}, {"name": "Capri", "color": "#3AA3E8", "coord": "40°33′N · 14°15′E", "live": false}, {"name": "Amalfi", "color": "#17A68F", "coord": "40°38′N · 14°36′E", "live": false}, {"name": "Procida", "color": "#F2805C", "coord": "40°46′N · 14°01′E", "live": false}];
    const a = this.state.active;
    const city = cities[a];
    const v = {};
    for (let i = 0; i < 6; i++) v['h' + i] = i === a ? city.color : '#F5F3EE';
    for (let i = 0; i < cities.length; i++) v['s' + i] = i === a;
    const count = cities.length;
    return {
      ...v,
      rot: this.state.rot,
      cityName: city.name,
      cityColor: city.color,
      live: city.live,
      soon: !city.live,
      heading: city.coord,
      blurb: city.live
        ? 'Private boats, local skippers and premium days on the water, picked by people who grew up here. Prices shown upfront.'
        : 'We are charting this coast now. Leave your details and we will tell you when ' + city.name + ' opens.',
      prev: () => this.turnTo((a - 1 + count) % count),
      next: () => this.turnTo((a + 1) % count),
      cities: cities.map((c, i) => ({
        name: c.name,
        color: c.color,
        status: c.live ? 'Live' : 'Soon',
        pressed: i === a ? 'true' : 'false',
        border: i === a ? c.color : '#3A4E5D',
        bg: i === a ? 'rgba(245,243,238,0.08)' : 'transparent',
        pick: () => this.turnTo(i),
      })),
    };
  }
}
</script>
